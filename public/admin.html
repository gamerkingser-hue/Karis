<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>ผู้ดูแล - Post-Match Evidence</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header class="top"><div class="brand">POST-MATCH <span>NETWORK EVIDENCE</span></div><div class="sub">ADMIN CONSOLE</div></header><main class="wrap">
<section class="panel" id="loginPanel"><h1>เข้าสู่ระบบผู้ดูแล</h1><p class="muted">ใช้บัญชีผู้ดูแลที่สร้างใน Supabase Authentication เท่านั้น</p><form id="loginForm"><label>อีเมล<input type="email" name="email" required autocomplete="username"></label><label>รหัสผ่าน<input type="password" name="password" required autocomplete="current-password"></label><button>เข้าสู่ระบบ</button></form><div id="loginMessage" class="message"></div></section>
<section id="dashboard" hidden><div class="dashhead"><div><h1>รายงานล่าสุด</h1><p class="muted">30 นาทีล่าสุด · <span id="lastUpdated"></span></p></div><button id="refreshBtn" class="secondary">รีเฟรช</button></div><div class="notice"><strong>คำเตือน</strong><p>VPN / Proxy / DNS เป็นคำรายงานจากผู้เล่น ไม่ใช่การสแกนย้อนหลังหรือหลักฐานว่าโกง</p></div><div id="reports"></div><button id="logoutBtn" class="secondary">ออกจากระบบ</button></section>
</main><script>
(()=>{const c=window.APP_CONFIG||{},lp=document.getElementById("loginPanel"),dash=document.getElementById("dashboard"),lm=document.getElementById("loginMessage"),out=document.getElementById("reports");let sb;
if(c.SUPABASE_URL&&!c.SUPABASE_URL.includes("YOUR-PROJECT")&&c.SUPABASE_ANON_KEY&&!c.SUPABASE_ANON_KEY.includes("YOUR_"))sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const map=(v,m)=>m[v]||v||"ไม่ระบุ";
async function session(){if(!sb)return;const {data}=await sb.auth.getSession();lp.hidden=!!data.session;dash.hidden=!data.session;if(data.session)await load()}
async function load(){out.innerHTML='<div class="panel muted">กำลังโหลด…</div>';const since=new Date(Date.now()-1800000).toISOString();const {data,error}=await sb.from("reports").select("*").gte("created_at",since).order("created_at",{ascending:false}).limit(200);
if(error){out.innerHTML='<div class="panel error">'+esc(error.message)+'</div>';return}document.getElementById("lastUpdated").textContent=new Date().toLocaleString("th-TH");
if(!data.length){out.innerHTML='<div class="panel muted">ไม่มีรายงานใน 30 นาทีล่าสุด</div>';return}
out.innerHTML=data.map(r=>`<article class="panel report"><div class="reporttop"><strong>${esc(r.player_label)}</strong><span class="tag">${esc(r.platform)}</span></div><p class="muted">แมตช์ ${esc(r.match_code)} · ${esc(new Date(r.created_at).toLocaleString("th-TH"))}</p><div class="grid"><div><small>VPN</small><b>${esc(map(r.vpn_status,{yes:"รายงานว่าใช้",no:"รายงานว่าไม่ใช้",unsure:"ไม่แน่ใจ"}))}</b></div><div><small>Proxy</small><b>${esc(map(r.proxy_status,{yes:"รายงานว่าใช้",no:"รายงานว่าไม่ใช้",unsure:"ไม่แน่ใจ"}))}</b></div><div><small>DNS</small><b>${esc(map(r.dns_mode,{custom:"รายงานว่าตั้งเอง",automatic:"รายงานว่าอัตโนมัติ",unsure:"ไม่แน่ใจ"}))}</b></div><div><small>ออนไลน์ตอนส่ง</small><b>${r.browser_online?"ใช่":"ไม่ใช่"}</b></div></div>${r.note?`<p>รายละเอียด: ${esc(r.note)}</p>`:""}<p class="disclaimer">หลักฐาน: คำรายงานจากผู้เล่น · ไม่ใช่ผลตรวจยืนยัน</p></article>`).join("")}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!sb){lm.textContent="ตั้งค่า public/config.js ก่อน";return}const f=new FormData(e.currentTarget),{error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){lm.className="message error";lm.textContent=error.message}else{lm.textContent="";await session()}});
document.getElementById("refreshBtn").addEventListener("click",load);document.getElementById("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();await session()});
if(!sb)lm.textContent="กรุณาตั้งค่า public/config.js ด้วย Project URL และ anon key";else session();
})();
</script></body></html>
